[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "marketing-measurement"
version = "0.1.0"
description = "Marketing Measurement and Audience Integration portfolio project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pydantic-settings>=2.6,<3",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "duckdb>=1.1,<2",
    "ipykernel>=6.29,<8",
    "mypy>=1.13,<2",
    "nbconvert>=7.16,<8",
    "pandas-stubs>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marketing_measurement"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
