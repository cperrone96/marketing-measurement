services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: marketing_measurement
      POSTGRES_USER: marketing_measurement
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing_measurement -d marketing_measurement"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
